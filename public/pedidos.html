<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>📦 Pedidos · Uniformes Bonaparte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0E0F12">

  <style>
    /* MEJORA AGREGADA (punto 25): tamanos de letra secundaria subidos para mejor lectura en el taller. Solo cambia el tamano visual; no se toco ninguna logica ni el CSS de los recibos impresos. */
    :root {
      --bg-dark: #0a0e27;
      --bg-darker: #050811;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%); color: var(--text-main); min-height: 100vh; position: relative; overflow-x: hidden; }
    body::before, body::after { content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
    body::before { width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); top: -250px; right: -250px; animation: float 8s ease-in-out infinite; }
    body::after { width: 400px; height: 400px; background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%); bottom: -200px; left: -200px; animation: float 10s ease-in-out infinite reverse; }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-20px) rotate(5deg);} }
    .shell { width: 100%; max-width: 600px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding: 16px 20px; background: var(--glass); border-radius: 20px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
    .header-info h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-info span { font-size: 13px; color: var(--text-muted); }
    .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; font-size: 20px; }
    .btn-back:hover { background: rgba(255,255,255,0.1); }
    .card { background: var(--glass); border-radius: 20px; border: 1px solid var(--glass-border); padding: 20px; margin-bottom: 16px; backdrop-filter: blur(20px); }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .subtext { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text-main); font-size: 14px; outline: none; transition: border 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    button { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #6366f1); color: white; width: 100%; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .btn-secondary.active { background: var(--accent); border-color: var(--accent); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-edit { background: rgba(139,92,246,0.2); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
    .oculto { display: none !important; }
    .mensaje-error, .mensaje-exito { display: none; padding: 12px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; font-weight: 600; text-align: center; }
    .mensaje-error { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .mensaje-exito { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .pedido-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .pedido-escuela { font-weight: 700; font-size: 15px; }
    .pedido-folio { font-size: 13px; color: var(--text-muted); }
    /* MEJORA AGREGADA (punto 19): marcar en rojo el campo que falta */
    .campo-falta {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18) !important;
    }
    .campo-falta-aviso {
      display: block; margin-top: 6px;
      font-size: 13px; color: #fca5a5;
    }
    /* MEJORA AGREGADA: aviso de fecha de entrega */
    .chip-entrega { display:inline-block; font-size: 12.5px; padding:2px 8px; border-radius:999px; margin-left:6px; }
    .chip-entrega.vencido { background:rgba(239,68,68,0.22); color:#fca5a5; }
    .chip-entrega.cerca { background:rgba(245,158,11,0.22); color:#fcd34d; }
    .chip-entrega.ok { background:rgba(34,197,94,0.18); color:#86efac; }
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700; }
    .badge-proceso { background: rgba(59,130,246,0.2); color: #93c5fd; }
    .badge-terminado { background: rgba(16,185,129,0.2); color: #6ee7b7; }
    .pedido-info { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
    .pedido-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .pedido-actions button { flex: 1; min-width: 80px; padding: 8px; font-size: 13px; }
    .filtros-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .filtros-row button { flex: 1; }
    .prendas-lista { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .prenda-tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; background: rgba(59,130,246,0.2); color: #93c5fd; }

    /* MEJORA AGREGADA: acordeón de pedidos + buscador */
    .pedido-header.pedido-header-toggle { cursor: pointer; }
    .pedido-toggle-arrow { font-size: 13px; color: var(--text-muted); display: inline-block; transition: transform 0.2s; margin-top: 3px; }
    .pedido-toggle-arrow.abierto { transform: rotate(90deg); }
    .pedido-quick-stats { font-size: 13px; color: var(--text-muted); margin: -4px 0 12px 26px; }
    #input-buscar-pedido { margin-bottom: 14px; }

    /* Items (nuevo) */
    .item-card { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .item-header-left { display: flex; gap: 8px; align-items: center; flex: 1; }
    .item-header-left select { flex: 1; }
    .item-header-left input[type="number"] { width: 80px; }
    .btn-remove-item { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); width: 32px; height: 32px; border-radius: 8px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; min-width: 32px; }
    .ops-table { width: 100%; font-size: 13px; border-collapse: collapse; margin-top: 8px; }
    .ops-table th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .ops-table td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main); }
    .ops-table input[type="number"] { width: 65px; padding: 6px; font-size: 13px; border-radius: 8px; }
    .ops-table .op-costura-input { width: 100%; padding: 6px 8px; font-size: 13px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); }
    .ops-table .op-maquina-select { width: 100px; padding: 6px; font-size: 12.5px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); }
    .ops-table .btn-remove-op { background: none; border: none; color: #fca5a5; cursor: pointer; font-size: 14px; padding: 2px 6px; }
    .btn-add-op { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px dashed rgba(59,130,246,0.3); font-size: 12.5px; padding: 6px 12px; margin-top: 6px; border-radius: 8px; }
    .btn-add-item { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px dashed rgba(16,185,129,0.3); width: 100%; padding: 12px; margin-bottom: 14px; font-size: 14px; }
    
    /* Acordeón de prendas */
    .item-card { padding: 0; overflow: hidden; }
    .item-accordion-header { display: flex; justify-content: space-between; align-items: center; padding: 14px; cursor: pointer; transition: background 0.2s; }
    .item-accordion-header:hover { background: rgba(255,255,255,0.03); }
    .item-accordion-toggle { font-size: 14px; margin-right: 10px; transition: transform 0.2s; }
    .item-card.expanded .item-accordion-toggle { transform: rotate(90deg); }
    .item-accordion-info { flex: 1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .item-accordion-info .prenda-nombre { font-weight: 600; font-size: 14px; color: var(--text-main); }
    .item-accordion-info .item-stats { display: flex; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .item-accordion-info .item-stats span { background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 6px; }
    .item-accordion-info .item-warning { color: #fbbf24; font-size: 13px; }
    .item-accordion-body { display: none; padding: 0 14px 14px 14px; border-top: 1px solid rgba(255,255,255,0.06); }
    .item-card.expanded .item-accordion-body { display: block; }
    .item-section-title { font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin: 12px 0 8px 0; display: flex; align-items: center; gap: 8px; }
    .item-section-title button { margin-left: auto; }

    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.3s; }
    .items-resumen { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
    .items-resumen-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
    .items-resumen-item .prenda-name { color: var(--text-main); font-weight: 600; }
    .items-resumen-item .cant { color: var(--text-muted); }
    .desglose-prendas { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
    .desglose-titulo { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    .desglose-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
    .desglose-prenda { color: var(--text-muted); }
    .desglose-monto { color: var(--success); font-weight: 600; }
    /* MEJORA AGREGADA: línea de mano de obra por prenda (costo unitario) */
    .desglose-manoobra { font-size: 12.5px; color: #fbbf24; margin: -2px 0 6px 0; padding-left: 2px; }

    /* Modales */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: linear-gradient(135deg, #0d1230, #0a0e27); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--glass-border); padding: 24px; max-width: 550px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--glass-border); }
    .modal-title { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #8b5cf6, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .modal-close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; font-size: 20px; }
    .modal-close:hover { background: rgba(255,255,255,0.1); transform: rotate(90deg); }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .modal-actions button { flex: 1; }
    /* ===================================================================
       MEJORA AGREGADA (punto 18): ventanas propias con el estilo de la app
       en lugar de las ventanitas grises del navegador.
       Todo vive bajo el prefijo .uiw- para no chocar con nada existente.
       =================================================================== */
    .uiw-overlay {
      position: fixed; inset: 0; z-index: 99999;
      background: rgba(3, 6, 20, 0.78);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; transition: opacity 0.18s ease;
    }
    .uiw-overlay.uiw-abierto { display: flex; opacity: 1; }
    .uiw-caja {
      width: 100%; max-width: 420px;
      background: linear-gradient(135deg, #101638, #0a0e27);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      padding: 22px;
      transform: translateY(10px) scale(0.98);
      transition: transform 0.18s ease;
      max-height: 88vh; overflow-y: auto;
      text-align: left;
    }
    .uiw-overlay.uiw-abierto .uiw-caja { transform: translateY(0) scale(1); }
    .uiw-icono {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 23px; margin-bottom: 14px;
    }
    .uiw-icono.uiw-info    { background: rgba(59, 130, 246, 0.18); }
    .uiw-icono.uiw-exito   { background: rgba(16, 185, 129, 0.18); }
    .uiw-icono.uiw-alerta  { background: rgba(245, 158, 11, 0.18); }
    .uiw-icono.uiw-peligro { background: rgba(239, 68, 68, 0.18); }
    .uiw-titulo {
      font-size: 17px; font-weight: 700; color: #f8fafc;
      margin-bottom: 8px; line-height: 1.3;
    }
    .uiw-texto {
      font-size: 14px; color: #cbd5e1; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
    }
    .uiw-detalle {
      margin-top: 12px; padding: 12px 14px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      font-size: 14px; color: #94a3b8; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .uiw-campo {
      width: 100%; margin-top: 14px;
      padding: 13px 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      color: #f8fafc; font-size: 15px; font-family: inherit;
      box-sizing: border-box;
    }
    .uiw-campo:focus { outline: none; border-color: #3b82f6; }
    .uiw-botones {
      display: flex; gap: 10px; margin-top: 20px;
      flex-wrap: wrap;
    }
    .uiw-btn {
      flex: 1 1 130px; min-height: 46px;
      padding: 12px 16px; border-radius: 12px;
      border: 1px solid transparent;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: filter 0.18s ease;
    }
    .uiw-btn:hover { filter: brightness(1.14); }
    .uiw-btn-cancelar {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
    }
    .uiw-btn-ok      { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; }
    .uiw-btn-exito   { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .uiw-btn-peligro { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }

    /* Avisos rápidos que no bloquean (para "guardado", "eliminado", etc.) */
    .uiw-tostadas {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 22px; z-index: 100000;
      display: flex; flex-direction: column; gap: 10px;
      width: calc(100% - 32px); max-width: 420px;
      pointer-events: none;
    }
    .uiw-tostada {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 13px 16px; border-radius: 14px;
      background: linear-gradient(135deg, #101638, #0a0e27);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      color: #f1f5f9; font-size: 14px; line-height: 1.45;
      white-space: pre-wrap; word-break: break-word;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .uiw-tostada.uiw-visible { opacity: 1; transform: translateY(0); }
    .uiw-tostada.uiw-t-exito   { border-left: 4px solid #10b981; }
    .uiw-tostada.uiw-t-error   { border-left: 4px solid #ef4444; }
    .uiw-tostada.uiw-t-info    { border-left: 4px solid #3b82f6; }
    .uiw-tostada.uiw-t-alerta  { border-left: 4px solid #f59e0b; }
    /* ===================================================================
       MEJORA AGREGADA (punto 22): avisos de "cargando..." para que se vea
       que la app está trabajando y no parezca que se quedó pegada.
       Todo va con el prefijo .uic- para no chocar con nada existente.
       =================================================================== */
    #uic-barra {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #10b981);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
      z-index: 100001;
      opacity: 0;
      transition: width 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
    }
    #uic-barra.uic-activa { opacity: 1; }
    .uic-cargando {
      display: flex; align-items: center; gap: 10px;
      padding: 18px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      color: #94a3b8; font-size: 14px;
    }
    .uic-rueda {
      width: 18px; height: 18px; flex: 0 0 18px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: uic-girar 0.75s linear infinite;
    }
    @keyframes uic-girar { to { transform: rotate(360deg); } }
    .uic-lineas { display: flex; flex-direction: column; gap: 10px; }
    .uic-linea {
      height: 46px; border-radius: 12px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.11) 37%, rgba(255,255,255,0.05) 63%);
      background-size: 400% 100%;
      animation: uic-brillo 1.3s ease-in-out infinite;
    }
    @keyframes uic-brillo {
      0%   { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
      /* MEJORA AGREGADA (punto 25): las etiquetas de estado y los filtros no se
       parten en dos lineas al tener la letra un poco mas grande. Solo visual. */
    .badge { white-space: nowrap; }
    .chip-entrega { white-space: nowrap; }
    .filtros-row { gap: 8px; }
    .filtros-row > button { white-space: nowrap; min-width: 0; padding-left: 10px; padding-right: 10px; }
</style>
</head>
<body>
<!-- MEJORA AGREGADA: si la sesion expira, la app regresa sola al login -->
  <!-- MEJORA AGREGADA (punto 18): ventanas con el estilo de la app -->
  <!-- MEJORA AGREGADA (punto 22): avisos de cargando -->
  <script>
    // =====================================================================
    // MEJORA AGREGADA (punto 22): avisos de "cargando...".
    //
    //   uiCargando(idOElemento, texto)  -> pinta un aviso dentro de un bloque
    //   uiEsqueleto(idOElemento, n)     -> pinta n renglones "fantasma"
    //   Barra de progreso arriba: se enciende sola mientras haya peticiones
    //   en curso. Todo va envuelto en try/catch: si algo fallara, la app
    //   sigue funcionando exactamente igual que antes.
    // =====================================================================
    (function () {
      "use strict";
      if (window.uiCargando) return;

      function resolver(ref) {
        if (!ref) return null;
        return typeof ref === "string" ? document.getElementById(ref) : ref;
      }

      window.uiCargando = function (ref, texto) {
        try {
          var el = resolver(ref);
          if (!el) return;
          el.innerHTML =
            '<div class="uic-cargando"><div class="uic-rueda"></div><span>' +
            String(texto || "Cargando\u2026").replace(/</g, "&lt;") +
            "</span></div>";
        } catch (e) {}
      };

      window.uiEsqueleto = function (ref, n) {
        try {
          var el = resolver(ref);
          if (!el) return;
          var cuantos = Math.max(1, Math.min(8, Number(n) || 3));
          var html = '<div class="uic-lineas">';
          for (var i = 0; i < cuantos; i++) html += '<div class="uic-linea"></div>';
          el.innerHTML = html + "</div>";
        } catch (e) {}
      };

      // ---- barra de progreso automática ----
      try {
        var barra = null, enCurso = 0, temporizador = null;

        function obtenerBarra() {
          if (barra && barra.parentNode) return barra;
          barra = document.getElementById("uic-barra");
          if (!barra) {
            barra = document.createElement("div");
            barra.id = "uic-barra";
            (document.body || document.documentElement).appendChild(barra);
          }
          return barra;
        }

        function pintar() {
          var b = obtenerBarra();
          if (enCurso > 0) {
            b.classList.add("uic-activa");
            var ancho = Math.min(90, 30 + enCurso * 12);
            b.style.width = ancho + "%";
          } else {
            b.style.width = "100%";
            clearTimeout(temporizador);
            temporizador = setTimeout(function () {
              b.classList.remove("uic-activa");
              setTimeout(function () { if (enCurso === 0) b.style.width = "0"; }, 260);
            }, 180);
          }
        }

        var fetchOriginal = window.fetch;
        if (typeof fetchOriginal === "function") {
          window.fetch = function () {
            var p;
            try { enCurso++; pintar(); } catch (e) {}
            try {
              p = fetchOriginal.apply(this, arguments);
            } catch (e) {
              try { enCurso = Math.max(0, enCurso - 1); pintar(); } catch (e2) {}
              throw e;
            }
            if (p && typeof p.then === "function") {
              var bajar = function () { try { enCurso = Math.max(0, enCurso - 1); pintar(); } catch (e) {} };
              p.then(bajar, bajar);
            } else {
              try { enCurso = Math.max(0, enCurso - 1); pintar(); } catch (e) {}
            }
            return p;
          };
        }
      } catch (e) {
        try { console.warn("barra de carga omitida:", e); } catch (e2) {}
      }
    })();
  </script>

  <script>
    // =====================================================================
    // MEJORA AGREGADA (punto 18): ventanas con el estilo de la app.
    //
    //   uiAviso(mensaje, opciones)       -> Promise<void>   (informar)
    //   uiConfirmar(mensaje, opciones)   -> Promise<boolean> (sí / no)
    //   uiPreguntar(mensaje, opciones)   -> Promise<string|null> (escribir algo)
    //   uiToast(mensaje, tipo)           -> aviso rápido que no bloquea
    //
    // Si por cualquier razón algo fallara, cada función cae de vuelta a la
    // ventanita del navegador, así ninguna acción se queda a medias.
    // =====================================================================
    (function () {
      "use strict";
      if (window.uiConfirmar) return; // ya estaba cargado

      var ICONOS = { info: "\u2139\uFE0F", exito: "\u2705", alerta: "\u26A0\uFE0F", peligro: "\uD83D\uDDD1\uFE0F", pregunta: "\u270F\uFE0F" };

      function contenedorTostadas() {
        var c = document.getElementById("uiw-tostadas");
        if (!c) {
          c = document.createElement("div");
          c.id = "uiw-tostadas";
          c.className = "uiw-tostadas";
          document.body.appendChild(c);
        }
        return c;
      }

      function uiToast(mensaje, tipo) {
        try {
          var t = document.createElement("div");
          t.className = "uiw-tostada uiw-t-" + (tipo || "info");
          t.textContent = String(mensaje == null ? "" : mensaje);
          contenedorTostadas().appendChild(t);
          requestAnimationFrame(function () { t.classList.add("uiw-visible"); });
          var ms = (tipo === "error" || tipo === "alerta") ? 5200 : 3200;
          setTimeout(function () {
            t.classList.remove("uiw-visible");
            setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 260);
          }, ms);
        } catch (e) {
          try { console.warn("uiToast:", e); } catch (e2) {}
        }
      }

      // Construye y muestra una ventana. Devuelve una promesa con el resultado.
      function abrir(cfg) {
        return new Promise(function (resolver) {
          var overlay, campo, cerrado = false;

          function cerrar(valor) {
            if (cerrado) return;
            cerrado = true;
            document.removeEventListener("keydown", alTeclado, true);
            overlay.classList.remove("uiw-abierto");
            setTimeout(function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 200);
            resolver(valor);
          }

          function alTeclado(ev) {
            if (ev.key === "Escape") { ev.preventDefault(); cerrar(cfg.valorCancelar); }
            else if (ev.key === "Enter" && (!campo || campo.tagName !== "TEXTAREA")) {
              ev.preventDefault();
              cerrar(cfg.tipoVentana === "preguntar" ? (campo ? campo.value : "") : true);
            }
          }

          overlay = document.createElement("div");
          overlay.className = "uiw-overlay";

          var caja = document.createElement("div");
          caja.className = "uiw-caja";
          caja.setAttribute("role", "dialog");
          caja.setAttribute("aria-modal", "true");

          var estilo = cfg.estilo || "info";
          var ico = document.createElement("div");
          ico.className = "uiw-icono uiw-" + estilo;
          ico.textContent = cfg.icono || ICONOS[estilo] || ICONOS.info;
          caja.appendChild(ico);

          if (cfg.titulo) {
            var h = document.createElement("div");
            h.className = "uiw-titulo";
            h.textContent = cfg.titulo;
            caja.appendChild(h);
          }
          if (cfg.mensaje) {
            var p = document.createElement("div");
            p.className = "uiw-texto";
            p.textContent = cfg.mensaje;
            caja.appendChild(p);
          }
          if (cfg.detalle) {
            var d = document.createElement("div");
            d.className = "uiw-detalle";
            d.textContent = cfg.detalle;
            caja.appendChild(d);
          }

          if (cfg.tipoVentana === "preguntar") {
            campo = document.createElement("input");
            campo.className = "uiw-campo";
            campo.type = cfg.tipoCampo || "text";
            campo.value = cfg.valorInicial == null ? "" : String(cfg.valorInicial);
            if (cfg.marcador) campo.placeholder = cfg.marcador;
            caja.appendChild(campo);
          }

          var fila = document.createElement("div");
          fila.className = "uiw-botones";

          if (cfg.tipoVentana !== "aviso") {
            var bCancel = document.createElement("button");
            bCancel.type = "button";
            bCancel.className = "uiw-btn uiw-btn-cancelar";
            bCancel.textContent = cfg.textoCancelar || "Cancelar";
            bCancel.addEventListener("click", function () { cerrar(cfg.valorCancelar); });
            fila.appendChild(bCancel);
          }

          var claseOk = "uiw-btn-ok";
          if (estilo === "peligro") claseOk = "uiw-btn-peligro";
          else if (estilo === "exito") claseOk = "uiw-btn-exito";

          var bOk = document.createElement("button");
          bOk.type = "button";
          bOk.className = "uiw-btn " + claseOk;
          bOk.textContent = cfg.textoOk || (cfg.tipoVentana === "aviso" ? "Entendido" : "Aceptar");
          bOk.addEventListener("click", function () {
            cerrar(cfg.tipoVentana === "preguntar" ? (campo ? campo.value : "") : true);
          });
          fila.appendChild(bOk);

          caja.appendChild(fila);
          overlay.appendChild(caja);
          overlay.addEventListener("click", function (ev) {
            if (ev.target === overlay) cerrar(cfg.valorCancelar);
          });

          document.body.appendChild(overlay);
          document.addEventListener("keydown", alTeclado, true);
          requestAnimationFrame(function () {
            overlay.classList.add("uiw-abierto");
            try { (campo || bOk).focus(); if (campo) campo.select(); } catch (e) {}
          });
        });
      }

      window.uiToast = uiToast;

      window.uiAviso = function (mensaje, opciones) {
        var o = opciones || {};
        try {
          return abrir({
            tipoVentana: "aviso",
            estilo: o.estilo || "info",
            icono: o.icono,
            titulo: o.titulo || "Aviso",
            mensaje: mensaje,
            detalle: o.detalle,
            textoOk: o.textoOk || "Entendido",
            valorCancelar: undefined
          });
        } catch (e) {
          try { window.alert(mensaje); } catch (e2) {}
          return Promise.resolve();
        }
      };

      window.uiConfirmar = function (mensaje, opciones) {
        var o = opciones || {};
        try {
          return abrir({
            tipoVentana: "confirmar",
            estilo: o.estilo || "alerta",
            icono: o.icono,
            titulo: o.titulo || "¿Confirmas?",
            mensaje: mensaje,
            detalle: o.detalle,
            textoOk: o.textoOk || "Sí, continuar",
            textoCancelar: o.textoCancelar || "Cancelar",
            valorCancelar: false
          });
        } catch (e) {
          return Promise.resolve(window.confirm(mensaje));
        }
      };

      window.uiPreguntar = function (mensaje, opciones) {
        var o = opciones || {};
        try {
          return abrir({
            tipoVentana: "preguntar",
            estilo: o.estilo || "pregunta",
            icono: o.icono,
            titulo: o.titulo || "Escribe el dato",
            mensaje: mensaje,
            detalle: o.detalle,
            valorInicial: o.valorInicial,
            marcador: o.marcador,
            tipoCampo: o.tipoCampo || "text",
            textoOk: o.textoOk || "Guardar",
            textoCancelar: o.textoCancelar || "Cancelar",
            valorCancelar: null
          });
        } catch (e) {
          return Promise.resolve(window.prompt(mensaje, o.valorInicial || ""));
        }
      };
    })();
  </script>

<script>

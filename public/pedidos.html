  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      let usuarioActual;
      try {
        const d = localStorage.getItem("usuarioActual");
        if (!d) throw new Error();
        usuarioActual = JSON.parse(d);
        if (!usuarioActual.tipo || !usuarioActual.nombre) throw new Error();
      } catch { localStorage.removeItem("usuarioActual"); alert("Sesión inválida."); window.location.href="/login.html"; return; }

      const spanNombre = document.getElementById("nombre-usuario");
      const cardNuevo = document.getElementById("card-nuevo-pedido");
      const cardFiltros = document.getElementById("card-filtros");
      const listaPedidos = document.getElementById("lista-pedidos");
      const msgErr = document.getElementById("mensaje-error");
      const msgOk = document.getElementById("mensaje-exito");
      const modalEditar = document.getElementById("modal-editar");
      const modalAvance = document.getElementById("modal-avance");

      let filtroActual = "activo";
      let pedidoEditando = null;
      const esEnc = usuarioActual.tipo === "encargada";
      const esAdmin = usuarioActual.tipo === "admin";
      if (spanNombre) spanNombre.textContent = usuarioActual.nombre;

      let prendasCache = [];
      let maquinasCache = [];

      async function cargarDatosBase() {
        try {
          const [rp, rm] = await Promise.all([fetch("/api/prendas"), fetch("/api/maquinas")]);
          prendasCache = await rp.json();
          maquinasCache = await rm.json();
        } catch(e) { console.error("Error cargando datos base:", e); }
      }
      await cargarDatosBase();

      // MEJORA AGREGADA: refresca las sugerencias del datalist de máquinas usado al agregar operaciones nuevas
      function actualizarDatalistMaquinas() {
        try {
          const dl = document.getElementById("datalist-maquinas");
          if (!dl) return;
          dl.innerHTML = maquinasCache.map(m => `<option value="${m}"></option>`).join("");
        } catch(e) { /* no romper si algo falla */ }
      }
      actualizarDatalistMaquinas();

      if (esAdmin || esEnc) { cardNuevo.classList.remove("oculto"); cardFiltros.classList.remove("oculto"); }
      if (usuarioActual.tipo === "operaria") filtroActual = "activo";

      // ========== ITEMS SYSTEM ==========
      function crearItemHTML(containerId, itemData, expanded = true) {
        const container = document.getElementById(containerId);
        const div = document.createElement("div");
        div.className = "item-card" + (expanded ? " expanded" : "");
        const opts = prendasCache.map(p =>
          `<option value="${p.id}" ${itemData && itemData.prendaId === p.id ? 'selected' : ''}>${p.nombre}</option>`
        ).join("");
        const prendaNombre = itemData && itemData.prendaId ? (prendasCache.find(p => p.id === itemData.prendaId)?.nombre || 'Prenda') : 'Nueva prenda';
        const cantidadTotal = itemData ? (itemData.cantidad || 0) : 0;
        const numOps = itemData && itemData.operaciones ? itemData.operaciones.length : 0;
        
        // MEJORA AGREGADA (modelos): se guarda el id de renglon para no confundir
        // dos veces la misma prenda dentro del mismo pedido.
        try {
          if (itemData && itemData.itemId !== undefined && itemData.itemId !== null) {
            div.dataset.itemId = itemData.itemId;
          }
        } catch (eId) {}
        // MEJORA AGREGADA (modelos): texto libre para diferenciar modelos
        const modeloActual = (itemData && itemData.modelo) ? String(itemData.modelo) : '';
        const modeloEscapado = modeloActual.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        div.innerHTML = `
          <div class="item-accordion-header" onclick="window._toggleAccordion(this)">
            <span class="item-accordion-toggle">▶</span>
            <div class="item-accordion-info">
              <span class="prenda-nombre">${prendaNombre}</span>
              <span class="prenda-modelo" style="display:${modeloActual ? 'block' : 'none'};font-size:12px;color:var(--text-muted);font-weight:600;">${modeloEscapado}</span>
              <div class="item-stats">
                <span class="lbl-total-pzs">${cantidadTotal} pzs</span>
                <span class="lbl-total-ops">${numOps} ops</span>
              </div>
              <span class="item-warning" style="display:${cantidadTotal === 0 ? 'inline' : 'none'}">⚠️ Sin tallas</span>
            </div>
            <button class="btn-remove-item" onclick="event.stopPropagation(); this.closest('.item-card').remove()">✕</button>
          </div>
          <div class="item-accordion-body">
            <div class="item-section-title" style="margin-top:14px;">
              <span>📦 Prenda</span>
            </div>
            <select class="sel-prenda" onchange="window._cargarPlantilla(this); window._updateAccordionHeader(this);">
              <option value="">-- Seleccionar --</option>${opts}
            </select>

            <!-- MEJORA AGREGADA (modelos): permite tener la misma prenda varias veces
                 en un pedido, diferenciada por este texto. Es opcional y solo se vuelve
                 obligatorio cuando la prenda se repite. -->
            <div class="item-section-title">
              <span>🏷️ Modelo <span style="font-weight:400;color:var(--text-muted);">(opcional)</span></span>
            </div>
            <input type="text" class="inp-modelo" maxlength="60" value="${modeloEscapado}"
                   placeholder="Ej: rojo bies blanco"
                   oninput="window._updateModeloHeader(this)" />

            
            <div class="item-section-title">
              <span>📐 Tallas</span>
              <button type="button" class="btn-add-op" onclick="window._addTalla(this)">+ Talla</button>
            </div>
            <div class="tallas-container"></div>
            
            <div class="item-section-title">
              <span>✂️ Operaciones</span>
            </div>
            <div class="ops-container"></div>
          </div>`;
        container.appendChild(div);
        // Render tallas
        renderTallas(div, (itemData && itemData.tallas) ? itemData.tallas : []);
        if (itemData && itemData.operaciones && itemData.operaciones.length > 0) {
          renderOps(div, itemData.operaciones);
        } else if (itemData && itemData.prendaId) {
          cargarPlantilla(div, itemData.prendaId);
        }
      }

      window._toggleAccordion = function(header) {
        const card = header.closest('.item-card');
        card.classList.toggle('expanded');
      };

      window._updateAccordionHeader = function(sel) {
        const card = sel.closest('.item-card');
        const nombre = sel.options[sel.selectedIndex]?.text || 'Nueva prenda';
        card.querySelector('.prenda-nombre').textContent = nombre;
      };

      // MEJORA AGREGADA (modelos): refleja el modelo en el encabezado del renglon
      window._updateModeloHeader = function(inp) {
        try {
          const card = inp.closest('.item-card');
          const lbl = card.querySelector('.prenda-modelo');
          if (!lbl) return;
          const txt = (inp.value || '').trim();
          lbl.textContent = txt;
          lbl.style.display = txt ? 'block' : 'none';
        } catch (e) {}
      };

      window._cargarPlantilla = function(sel) {
        const card = sel.closest(".item-card");
        if (!sel.value) { card.querySelector(".ops-container").innerHTML = ""; return; }
        cargarPlantilla(card, sel.value);
      };

      
      function renderTallas(card, tallas) {
        const c = card.querySelector(".tallas-container");
        let h = `<table class="ops-table"><thead><tr><th>Talla</th><th>Cant.</th><th></th></tr></thead><tbody>`;
        (tallas || []).forEach(t => {
          h += `<tr>
            <td><input type="text" class="talla-input" value="${(t.talla||'')}" placeholder="Ej: 10 / CH / 28" /></td>
            <td><input type="number" class="talla-cantidad" value="${Number(t.cantidad)||0}" min="0" step="1" /></td>
            <td><button class="btn-remove-op" onclick="this.closest('tr').remove(); window._recalcularTotal(this);">✕</button></td>
          </tr>`;
        });
        h += `</tbody></table>`;
        c.innerHTML = h;
        // Recalcular total al render
        recalcularTotal(card);
        // Listener de cambio
        c.querySelectorAll(".talla-input,.talla-cantidad").forEach(inp => {
          inp.addEventListener("input", () => recalcularTotal(card));
        });
      }

      function recalcularTotal(card) {
        let total = 0;
        card.querySelectorAll(".tallas-container tbody tr").forEach(tr => {
          const cant = Number(tr.querySelector(".talla-cantidad").value) || 0;
          total += cant;
        });
        // Actualizar header del acordeón
        const lblPzs = card.querySelector(".lbl-total-pzs");
        if (lblPzs) lblPzs.textContent = total + " pzs";
        const warning = card.querySelector(".item-warning");
        if (warning) warning.style.display = total === 0 ? 'inline' : 'none';
      }

      window._recalcularTotal = function(el) {
        const card = el.closest(".item-card");
        recalcularTotal(card);
      };

      window._addTalla = function(btn) {
        const card = btn.closest(".item-card");
        const tbody = card.querySelector(".tallas-container tbody");
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="text" class="talla-input" placeholder="Ej: 10 / CH / 28" /></td>
          <td><input type="number" class="talla-cantidad" value="0" min="0" step="1" /></td>
          <td><button class="btn-remove-op" onclick="this.closest('tr').remove(); window._recalcularTotal(this);">✕</button></td>`;
        tbody.appendChild(tr);
        tr.querySelectorAll(".talla-input,.talla-cantidad").forEach(inp => {
          inp.addEventListener("input", () => recalcularTotal(card));
        });
        recalcularTotal(card);
      };

async function cargarPlantilla(card, prendaId) {
        try {
          const r = await fetch(`/api/plantillas-costuras/${prendaId}`);
          const d = await r.json();
          renderOps(card, (d.operaciones||[]).map(o => ({costura:o.costura, maquina:o.maquina, precio:0})));
        } catch(e) { console.error(e); }
      }

      function renderOps(card, ops) {
        const c = card.querySelector(".ops-container");
        const mOpts = maquinasCache.map(m => `<option value="${m}">${m}</option>`).join("");
        let h = `<table class="ops-table"><thead><tr><th>Costura</th><th>Máquina</th><th>$</th><th></th></tr></thead><tbody>`;
        ops.forEach(op => {
          const sel = maquinasCache.map(m => `<option value="${m}" ${m===op.maquina?'selected':''}>${m}</option>`).join("");
          h += `<tr>
            <td><input type="text" class="op-costura-input" value="${op.costura||op.descripcion||''}" readonly style="opacity:0.9;" /></td>
            <td><input type="text" class="op-maquina-select" value="${op.maquina||''}" readonly style="opacity:0.9;" /></td>
            <td><input type="number" class="op-precio" value="${op.precio||0}" min="0" step="0.5" /></td>
            <td style="color:rgba(255,255,255,0.35);font-size: 13px;">catálogo</td>
          </tr>`;
        });
        h += `</tbody></table><div style="margin-top:6px;color:rgba(255,255,255,0.55);font-size: 13px;">Operaciones cargadas del catálogo (no se pueden editar).</div>`;
        // MEJORA AGREGADA: permite agregar una operación (costura + máquina) nueva sin salir a Configuración
        h += `<button type="button" class="btn-add-op btn-agregar-operacion-nueva" style="margin-top:8px;width:100%;">✂️ + Agregar operación nueva</button>
        <div class="form-nueva-operacion oculto" style="margin-top:8px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);">
          <input type="text" class="input-nueva-costura" placeholder="Nombre de la costura/operación" style="width:100%;margin-bottom:6px;padding:8px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:var(--text-main);font-size: 13px;box-sizing:border-box;" />
          <input type="text" class="input-nueva-maquina" list="datalist-maquinas" placeholder="Máquina (existente o escribe una nueva)" style="width:100%;margin-bottom:6px;padding:8px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:var(--text-main);font-size: 13px;box-sizing:border-box;" />
          <input type="number" class="input-nueva-precio" placeholder="Precio" min="0" step="0.5" style="width:100%;margin-bottom:8px;padding:8px;border-radius:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:var(--text-main);font-size: 13px;box-sizing:border-box;" />
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn-confirmar-nueva-operacion" style="flex:1;background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3);padding:7px;border-radius:8px;font-size: 13px;">✓ Agregar</button>
            <button type="button" class="btn-cancelar-nueva-operacion" style="flex:1;background:rgba(255,255,255,0.05);color:var(--text-muted);border:1px solid rgba(255,255,255,0.1);padding:7px;border-radius:8px;font-size: 13px;">Cancelar</button>
          </div>
          <div class="msg-nueva-operacion" style="font-size: 12.5px;margin-top:6px;"></div>
        </div>`;
        // MEJORA AGREGADA: suma en vivo de la mano de obra de esta prenda mientras capturas precios
        h += `<div class="suma-mano-obra" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(251,191,36,0.10);border:1px solid rgba(251,191,36,0.25);">
          <span style="font-size: 13px;color:#fcd34d;font-weight:600;">🧵 Mano de obra por prenda</span>
          <span class="suma-mano-obra-valor" style="font-size:14px;color:#fbbf24;font-weight:700;">$0.00</span>
        </div>`;
        c.innerHTML = h;
        // Actualizar conteo de ops en header
        const lblOps = card.querySelector(".lbl-total-ops");
        if (lblOps) lblOps.textContent = ops.length + " ops";
        // MEJORA AGREGADA: enganchar el cálculo en vivo a cada input de precio
        card.querySelectorAll(".op-precio").forEach(inp => {
          inp.addEventListener("input", () => actualizarSumaManoObra(card));
        });
        actualizarSumaManoObra(card);
        configurarBotonAgregarOperacionNueva(card); // MEJORA AGREGADA
      }

      // MEJORA AGREGADA: suma los precios capturados de una prenda y muestra el total en vivo.
      // Las operaciones en 0 simplemente no suman (es correcto: no aplican a ese modelo).
      function actualizarSumaManoObra(card) {
        try {
          let suma = 0;
          card.querySelectorAll(".ops-container .ops-table tbody tr .op-precio").forEach(inp => {
            suma += Number(inp.value) || 0;
          });
          const lbl = card.querySelector(".suma-mano-obra-valor");
          if (lbl) lbl.textContent = "$" + suma.toFixed(2);
        } catch (e) { /* no romper la captura si algo falla */ }
      }

      // MEJORA AGREGADA: permite agregar una operación (costura + máquina) nueva sin salir a Configuración.
      // La operación se guarda en la plantilla de la prenda (y la máquina en el catálogo si es nueva),
      // y se agrega como fila editable a la tabla de operaciones de este pedido.
      function configurarBotonAgregarOperacionNueva(card) {
        try {
          const btnMostrar = card.querySelector(".btn-agregar-operacion-nueva");
          const formNueva = card.querySelector(".form-nueva-operacion");
          if (!btnMostrar || !formNueva) return;
          const inputCostura = formNueva.querySelector(".input-nueva-costura");
          const inputMaquina = formNueva.querySelector(".input-nueva-maquina");
          const inputPrecio = formNueva.querySelector(".input-nueva-precio");
          const btnConfirmar = formNueva.querySelector(".btn-confirmar-nueva-operacion");
          const btnCancelar = formNueva.querySelector(".btn-cancelar-nueva-operacion");
          const msg = formNueva.querySelector(".msg-nueva-operacion");

          btnMostrar.addEventListener("click", () => {
            formNueva.classList.remove("oculto");
            btnMostrar.style.display = "none";
            inputCostura.focus();
          });
          btnCancelar.addEventListener("click", () => {
            formNueva.classList.add("oculto");
            btnMostrar.style.display = "";
            inputCostura.value = ""; inputMaquina.value = ""; inputPrecio.value = "";
            msg.textContent = "";
          });

          btnConfirmar.addEventListener("click", async () => {
            const costura = inputCostura.value.trim();
            const maquina = inputMaquina.value.trim();
            const precio = Number(inputPrecio.value) || 0;
            const prendaId = Number(card.querySelector(".sel-prenda").value);

            if (!costura || !maquina) {
              msg.style.color = "#fca5a5";
              msg.textContent = "Escribe el nombre de la costura y la máquina.";
              return;
            }
            if (!prendaId) {
              msg.style.color = "#fca5a5";
              msg.textContent = "Selecciona primero la prenda.";
              return;
            }

            btnConfirmar.disabled = true;
            btnConfirmar.textContent = "Guardando...";
            try {
              // Si la máquina no existe en el catálogo, se agrega primero
              if (!maquinasCache.includes(maquina)) {
                await fetch("/api/maquinas", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ nombre: maquina })
                });
                maquinasCache.push(maquina);
                actualizarDatalistMaquinas();
              }

              // Se agrega la operación a la plantilla de la prenda (queda disponible para futuros pedidos)
              const r = await fetch(`/api/plantillas-costuras/${prendaId}/agregar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ costura, maquina })
              });
              if (!r.ok) throw new Error();

              // Se agrega como fila editable a la tabla de operaciones de este pedido
              const tbody = card.querySelector(".ops-container .ops-table tbody");
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td><input type="text" class="op-costura-input" value="${costura}" readonly style="opacity:0.9;" /></td>
                <td><input type="text" class="op-maquina-select" value="${maquina}" readonly style="opacity:0.9;" /></td>
                <td><input type="number" class="op-precio" value="${precio}" min="0" step="0.5" /></td>
                <td style="color:#86efac;font-size: 13px;">nueva</td>`;
              tbody.appendChild(tr);
              tr.querySelector(".op-precio").addEventListener("input", () => actualizarSumaManoObra(card));
              actualizarSumaManoObra(card);

              const lblOps = card.querySelector(".lbl-total-ops");
              if (lblOps) lblOps.textContent = tbody.querySelectorAll("tr").length + " ops";

              formNueva.classList.add("oculto");
              btnMostrar.style.display = "";
              inputCostura.value = ""; inputMaquina.value = ""; inputPrecio.value = "";
              msg.textContent = "";
            } catch (e) {
              msg.style.color = "#fca5a5";
              msg.textContent = "❌ No se pudo agregar la operación. Intenta de nuevo.";
            } finally {
              btnConfirmar.disabled = false;
              btnConfirmar.textContent = "✓ Agregar";
            }
          });
        } catch (e) { /* no romper la captura de operaciones si algo falla aquí */ }
      }

      /* Las operaciones que ya vienen del catálogo no se pueden editar directamente aquí, pero se puede
         agregar una operación nueva con el botón "+ Agregar operación nueva" (MEJORA AGREGADA). */

      function extraerItems(containerId) {
        const items = [];
        document.getElementById(containerId).querySelectorAll(".item-card").forEach(card => {
          const prendaId = Number(card.querySelector(".sel-prenda").value);
          const tallas = [];
          card.querySelectorAll(".tallas-container tbody tr").forEach(tr => {
            const talla = tr.querySelector(".talla-input").value.trim();
            const c = Number(tr.querySelector(".talla-cantidad").value) || 0;
            if (talla && c > 0) tallas.push({ talla, cantidad: c });
          });
          const cantidad = tallas.length > 0 ? tallas.reduce((s,t)=>s+t.cantidad,0) : 0;
          if (!prendaId || !cantidad) return;
          const operaciones = [];
          card.querySelectorAll(".ops-container .ops-table tbody tr").forEach(tr => {
            const costura = tr.querySelector(".op-costura-input").value.trim();
            const maquina = tr.querySelector(".op-maquina-select").value;
            const precio = Number(tr.querySelector(".op-precio").value) || 0;
            if (costura && maquina) operaciones.push({costura, maquina, precio});
          });
          // MEJORA AGREGADA (modelos): se manda el modelo y el id de renglon
          const nuevoItem = {prendaId, cantidad, tallas, operaciones};
          try {
            const inpModelo = card.querySelector(".inp-modelo");
            const modeloTxt = inpModelo ? inpModelo.value.replace(/\s+/g, " ").trim() : "";
            if (modeloTxt) nuevoItem.modelo = modeloTxt;
            const idRenglon = Number(card.dataset ? card.dataset.itemId : 0);
            if (Number.isFinite(idRenglon) && idRenglon > 0) nuevoItem.itemId = idRenglon;
          } catch (eMod) {}
          items.push(nuevoItem);
        });
        return items;
      }

      document.getElementById("btn-agregar-item").addEventListener("click", () => crearItemHTML("items-nuevo-pedido"));
      document.getElementById("btn-agregar-item-edit").addEventListener("click", () => crearItemHTML("items-edit-pedido"));

      // ========== VALIDACIÓN ==========
      // ===================================================================
      // MEJORA AGREGADA (punto 19): en lugar de un mensaje genérico, se marca
      // en rojo el campo exacto que falta, se le hace scroll y se le da foco.
      // ===================================================================
      function limpiarMarcas(contenedor) {
        try {
          const raiz = contenedor || document;
          raiz.querySelectorAll(".campo-falta").forEach(el => el.classList.remove("campo-falta"));
          raiz.querySelectorAll(".campo-falta-aviso").forEach(el => el.remove());
        } catch (e) {}
      }

      function marcarCampo(el, aviso) {
        try {
          if (!el) return;
          el.classList.add("campo-falta");
          if (aviso) {
            const nota = document.createElement("small");
            nota.className = "campo-falta-aviso";
            nota.textContent = aviso;
            if (el.parentNode) el.parentNode.insertBefore(nota, el.nextSibling);
          }
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(() => { try { el.focus({ preventScroll: true }); } catch (e) {} }, 320);
          const quitar = () => {
            el.classList.remove("campo-falta");
            const sig = el.nextSibling;
            if (sig && sig.classList && sig.classList.contains("campo-falta-aviso")) sig.remove();
            el.removeEventListener("input", quitar);
            el.removeEventListener("change", quitar);
          };
          el.addEventListener("input", quitar);
          el.addEventListener("change", quitar);
        } catch (e) {}
      }

      // Revisa escuela + folio y devuelve el primer campo vacío
      function validarEncabezado(idEscuela, idFolio) {
        const elEsc = document.getElementById(idEscuela);
        const elFol = document.getElementById(idFolio);
        if (elEsc && !elEsc.value.trim()) {
          return { ok: false, campo: elEsc, error: "❌ Falta el nombre de la escuela", aviso: "Escribe el nombre de la escuela" };
        }
        if (elFol && !elFol.value.trim()) {
          return { ok: false, campo: elFol, error: "❌ Falta el folio del pedido", aviso: "Escribe el folio" };
        }
        return { ok: true };
      }

      function validarPrendas(containerId) {
        const cont = document.getElementById(containerId);
        const cards = cont.querySelectorAll(".item-card");
        // MEJORA AGREGADA (punto 19): se devuelve tambien el campo exacto que falla
        if (cards.length === 0) {
          return { ok: false, error: "❌ Agrega al menos una prenda al pedido" };
        }
        let n = 0;
        for (const card of cards) {
          n++;
          const sel = card.querySelector(".sel-prenda");
          const prendaId = sel ? sel.value : "";
          if (!prendaId) {
            return { ok: false, error: `❌ Falta elegir la prenda del renglón ${n}`, campo: sel, aviso: "Elige una prenda" };
          }
          let totalTallas = 0;
          let primeraFila = null;
          card.querySelectorAll(".tallas-container tbody tr").forEach(tr => {
            if (!primeraFila) primeraFila = tr;
            const talla = tr.querySelector(".talla-input").value.trim();
            const cant = Number(tr.querySelector(".talla-cantidad").value) || 0;
            if (talla && cant > 0) totalTallas += cant;
          });
          if (totalTallas === 0) {
            const nombre = card.querySelector(".prenda-nombre").textContent;
            const campoTalla = primeraFila ? primeraFila.querySelector(".talla-input") : card;
            return {
              ok: false,
              error: `❌ "${nombre}" necesita al menos una talla con cantidad`,
              campo: campoTalla,
              aviso: "Escribe la talla y cuántas piezas lleva"
            };
          }
        }

        // MEJORA AGREGADA (modelos): si la misma prenda aparece dos veces, cada
        // renglon necesita un modelo distinto para poder diferenciarlos.
        try {
          const normaliza = (txt) => (txt || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase().replace(/\s+/g, " ").trim();
          const porPrenda = new Map();
          cards.forEach(card => {
            const sel = card.querySelector(".sel-prenda");
            const pid = sel ? sel.value : "";
            if (!pid) return;
            if (!porPrenda.has(pid)) porPrenda.set(pid, []);
            const inp = card.querySelector(".inp-modelo");
            porPrenda.get(pid).push({ card, inp, modelo: normaliza(inp ? inp.value : "") });
          });
          for (const [pid, lista] of porPrenda) {
            if (lista.length < 2) continue;
            const nombrePrenda = lista[0].card.querySelector(".prenda-nombre").textContent;
            const sinModelo = lista.find(x => !x.modelo);
            if (sinModelo) {
              try { sinModelo.card.classList.add("expanded"); } catch (eExp) {}
              return {
                ok: false,
                error: `❌ "${nombrePrenda}" está repetida. Escribe el modelo de cada renglon para diferenciarlos`,
                campo: sinModelo.inp,
                aviso: 'Escribe el modelo, por ejemplo "rojo bies blanco"'
              };
            }
            const vistos = new Map();
            for (const x of lista) {
              if (vistos.has(x.modelo)) {
                try { x.card.classList.add("expanded"); } catch (eExp) {}
                return {
                  ok: false,
                  error: `❌ Hay dos renglones de "${nombrePrenda}" con el mismo modelo`,
                  campo: x.inp,
                  aviso: "Cambia el modelo para que sean distintos"
                };
              }
              vistos.set(x.modelo, true);
            }
          }
        } catch (eMod) { /* si algo falla, el servidor tambien lo valida */ }

        return { ok: true };
      }

      // ========== GUARDAR NUEVO ==========
      document.getElementById("btn-guardar-pedido").addEventListener("click", async () => {
        const escuela = document.getElementById("input-escuela").value.trim();
        const folio = document.getElementById("input-folio").value.trim();
        // MEJORA AGREGADA (punto 19): se marca el campo exacto que falta
        limpiarMarcas(document.getElementById("form-nuevo-pedido") || document);
        const enc = validarEncabezado("input-escuela", "input-folio");
        if (!enc.ok) { mostrarError(enc.error); marcarCampo(enc.campo, enc.aviso); return; }

        const validacion = validarPrendas("items-nuevo-pedido");
        if (!validacion.ok) { mostrarError(validacion.error); marcarCampo(validacion.campo, validacion.aviso); return; }
        
        const items = extraerItems("items-nuevo-pedido");
        if (items.length === 0) { mostrarError("❌ Agrega al menos una prenda con cantidad"); return; }

        const btn = document.getElementById("btn-guardar-pedido");
        btn.disabled = true; btn.textContent = "⏳ Guardando...";
        try {
          // MEJORA AGREGADA: fecha de entrega opcional
          let fechaEntrega = null;
          try {
            const inpFE = document.getElementById("input-fecha-entrega");
            if (inpFE && inpFE.value) fechaEntrega = inpFE.value;
          } catch (eFE) { fechaEntrega = null; }

          const cuerpoPedido = { escuela, folio, items };
          if (fechaEntrega) cuerpoPedido.fechaEntrega = fechaEntrega;

          const res = await fetch("/api/pedidos", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(cuerpoPedido) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          mostrarExito("✅ Pedido creado");
          document.getElementById("input-escuela").value = "";
          document.getElementById("input-folio").value = "";
          try { document.getElementById("input-fecha-entrega").value = ""; } catch (eLimpiar) {}
          document.getElementById("items-nuevo-pedido").innerHTML = "";
          await cargarPedidos();
        } catch(e) { mostrarError("❌ " + e.message); }
        finally { btn.disabled = false; btn.textContent = "💾 Guardar Pedido"; }
      });

      // ========== FILTROS ==========
      document.getElementById("filtro-proceso").addEventListener("click", () => cambiarFiltro("activo","filtro-proceso"));
      document.getElementById("filtro-terminado").addEventListener("click", () => cambiarFiltro("terminado","filtro-terminado"));
      document.getElementById("filtro-todos").addEventListener("click", () => cambiarFiltro("todos","filtro-todos"));
      function cambiarFiltro(f, id) {
        filtroActual = f;
        document.querySelectorAll(".filtros-row button").forEach(b => b.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        cargarPedidos();
      }

      // ========== LISTA PEDIDOS ==========
      // MEJORA AGREGADA: cache local de pedidos para poder filtrarlos con el buscador sin volver a pedir al servidor
      let pedidosCache = [];
      const inputBuscarPedido = document.getElementById("input-buscar-pedido");

      async function cargarPedidos() {
        // MEJORA AGREGADA (punto 22): aviso de que se está cargando la lista
        try { if (listaPedidos && listaPedidos.children.length === 0) uiEsqueleto(listaPedidos, 4); } catch (eC) {}
        try {
          let url = `/api/pedidos?conTotales=true&conPrendas=true&conDesglose=true`;
          url += usuarioActual.tipo === "operaria" ? `&estado=activo` : `&estado=${filtroActual}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Error");
          const pedidos = await res.json();
          pedidosCache = pedidos;
          aplicarFiltroBusquedaPedidos();
        } catch(e) { mostrarError("Error cargando pedidos: " + e.message); }
      }

      // MEJORA AGREGADA: filtra pedidosCache por texto (escuela, folio o nombre de prenda) y renderiza
      function aplicarFiltroBusquedaPedidos() {
        const q = (inputBuscarPedido && inputBuscarPedido.value ? inputBuscarPedido.value : "").trim().toLowerCase();
        if (!q) { renderListaPedidos(pedidosCache); return; }
        const filtrados = pedidosCache.filter(p => {
          const escuela = (p.escuela || "").toLowerCase();
          const folio = (p.folio || "").toLowerCase();
          let prendasTxt = "";
          if (p.items && p.items.length > 0) {
            prendasTxt = p.items.map(it => {
              const pr = prendasCache.find(x => x.id === it.prendaId);
              return pr ? pr.nombre : "";
            }).join(" ").toLowerCase();
          } else if (p.prendas) {
            prendasTxt = (Array.isArray(p.prendas) ? p.prendas : []).join(" ").toLowerCase();
          }
          return escuela.includes(q) || folio.includes(q) || prendasTxt.includes(q);
        });
        renderListaPedidos(filtrados);
      }
      if (inputBuscarPedido) inputBuscarPedido.addEventListener("input", aplicarFiltroBusquedaPedidos);

      function renderListaPedidos(pedidos) {
        try {
          if (pedidos.length === 0) { listaPedidos.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">No hay pedidos</p>'; return; }

          listaPedidos.innerHTML = pedidos.map(p => {
            let desglose = '';
            if (!esEnc && p.desglosePrendas && p.desglosePrendas.length > 0) {
              desglose = `<div class="desglose-prendas"><div class="desglose-titulo">💰 Desglose:</div>
                ${p.desglosePrendas.map(d => {
                  // MEJORA AGREGADA: mostrar el costo de mano de obra por prenda (costo unitario)
                  const cu = (typeof d.costoUnitario === "number") ? d.costoUnitario : 0;
                  const manoObra = cu > 0
                    ? `<div class="desglose-manoobra">🧵 Mano de obra: $${cu.toFixed(2)} por prenda</div>`
                    : '';
                  // MEJORA AGREGADA: si la prenda aún no tiene producción, en vez de "$0.00"
                  // mostramos una etiqueta clara; igual se muestra su mano de obra.
                  const montoDerecha = d.sinProduccion
                    ? `<span class="desglose-monto" style="color:var(--text-muted);font-weight:500;font-size: 13px;">Sin producción</span>`
                    : `<span class="desglose-monto">$${d.total.toFixed(2)}</span>`;
                  return `<div class="desglose-item"><span class="desglose-prenda">${d.prenda}</span>${montoDerecha}</div>${manoObra}`;
                }).join('')}</div>`;
            }

            let itemsHTML = '';
            if (p.items && p.items.length > 0) {
              itemsHTML = `<div class="items-resumen"><div class="desglose-titulo">📋 Prendas:</div>
                ${p.items.map(it => {
                  const pr = prendasCache.find(x => x.id === it.prendaId);
                  const nm = pr ? pr.nombre : (it.prenda || "?");
                  return `<div class="items-resumen-item"><span class="prenda-name">${nm}</span><span class="cant">${it.cantidad} pzas · ${(it.operaciones||[]).length} ops</span></div>`;
                }).join('')}</div>`;
            } else if (p.prendas && p.prendas.length > 0) {
              itemsHTML = `<div class="pedido-info"><strong>Prendas:</strong><div class="prendas-lista">${p.prendas.map(x => `<span class="prenda-tag">${x}</span>`).join('')}</div></div>`;
            }

            const costo = p.costoEstimado || 0;

            // MEJORA AGREGADA: el pedido ahora es un acordeón. El encabezado siempre se ve
            // (con un resumen rápido); el detalle completo se retrae y solo se muestra al hacer clic.
            return `<div class="pedido-item">
              <div class="pedido-header pedido-header-toggle" onclick="window._togglePedidoCard(${p.id})">
                <div style="display:flex;gap:8px;align-items:flex-start;">
                  <span class="pedido-toggle-arrow" id="pedido-flecha-${p.id}">▶</span>
                  <div><div class="pedido-escuela">${p.escuela}</div><div class="pedido-folio">Folio: ${p.folio}</div></div>
                </div>
                <span class="badge ${p.estado==='activo'?'badge-proceso':'badge-terminado'}">${p.estado==='activo'?'🔄 En Proceso':'✅ Terminado'}</span>
              </div>
              <div class="pedido-quick-stats">📦 ${p.totalPiezas||0} pzs${!esEnc?` · 💵 $${(p.totalPagado||0).toFixed(2)}`:''}</div>
              <div class="pedido-card-body oculto" id="pedido-cuerpo-${p.id}">
              ${itemsHTML}
              ${_lineaEntrega(p)}
              <div class="pedido-info">📦 Piezas registradas: <strong>${p.totalPiezas||0}</strong></div>
              <div class="pedido-info">👥 Operarias: <strong>${p.numeroOperarias||0}</strong></div>
              ${!esEnc ? `<div class="pedido-info">💵 Pagado: <strong>$${(p.totalPagado||0).toFixed(2)}</strong>${costo>0?` <span style="color:var(--text-muted);font-size: 12.5px;">/ Est: $${costo.toFixed(2)}</span>`:''}</div>${desglose}` : ''}
              ${(esAdmin||esEnc) ? `<div class="pedido-actions">
                ${p.items&&p.items.length>0?`<button class="btn-edit" onclick="verAvance(${p.id})" style="background:rgba(59,130,246,0.2);color:#93c5fd;border:1px solid rgba(59,130,246,0.3);">📊 Avance</button>`:''}
                <button class="btn-edit" onclick="abrirModalEditar(${p.id})">✏️ Editar</button>
                <button class="btn-edit" onclick="editarFechaEntrega(${p.id})" style="background:rgba(168,85,247,0.18);color:#d8b4fe;border:1px solid rgba(168,85,247,0.3);">📅 Entrega</button>
                ${p.estado==='activo'?`<button class="btn-warning" onclick="marcarTerminado(${p.id})">✅ Terminado</button>`:`<button class="btn-success" onclick="marcarActivo(${p.id})">🔄 Reactivar</button>`}
                ${esAdmin?`<button class="btn-danger" onclick="eliminarPedido(${p.id})">🗑️</button>`:''}
              </div>` : ''}
              </div>
            </div>`;
          }).join("");
        } catch(e) { mostrarError("Error cargando pedidos: " + e.message); }
      }

      // MEJORA AGREGADA: expandir/retraer el detalle de un pedido en la lista
      window._togglePedidoCard = function(id) {
        const cuerpo = document.getElementById(`pedido-cuerpo-${id}`);
        const flecha = document.getElementById(`pedido-flecha-${id}`);
        if (!cuerpo) return;
        const abierto = !cuerpo.classList.contains("oculto");
        if (abierto) { cuerpo.classList.add("oculto"); if (flecha) flecha.classList.remove("abierto"); }
        else { cuerpo.classList.remove("oculto"); if (flecha) flecha.classList.add("abierto"); }
      };


      // ===================================================================
      // MEJORA AGREGADA: fecha de entrega (opcional) y descarga en Excel.
      // Si un pedido no tiene fecha, se ve igual que siempre.
      // ===================================================================
      function _lineaEntrega(p) {
        try {
          if (!p || !p.fechaEntrega) return "";
          const fe = String(p.fechaEntrega).slice(0, 10);
          const partes = fe.split("-");
          const legible = partes.length === 3 ? (partes[2] + "/" + partes[1] + "/" + partes[0]) : fe;

          let chip = "";
          if ((p.estado || "activo") !== "terminado") {
            // Se usa la fecha LOCAL del dispositivo (igual que el resto de la app)
            const hoyYMD = new Date().toLocaleDateString("en-CA");
            const hoy = new Date(hoyYMD + "T12:00:00");
            const dest = new Date(fe + "T12:00:00");
            const dias = Math.round((dest - hoy) / 86400000);
            if (dias < 0) chip = '<span class="chip-entrega vencido">Vencido hace ' + Math.abs(dias) + ' d</span>';
            else if (dias === 0) chip = '<span class="chip-entrega vencido">Se entrega hoy</span>';
            else if (dias <= 3) chip = '<span class="chip-entrega cerca">Faltan ' + dias + ' d</span>';
            else chip = '<span class="chip-entrega ok">Faltan ' + dias + ' d</span>';
          }
          return '<div class="pedido-info">\u{1F4C5} Entrega: <strong>' + legible + '</strong>' + chip + '</div>';
        } catch (eLinea) {
          return "";
        }
      }

      window.editarFechaEntrega = async function(id) {
        try {
          const actual = (pedidosCache.find(x => x.id === id) || {}).fechaEntrega || "";
          // MEJORA AGREGADA (punto 18): ventana propia con selector de fecha
          const valor = await uiPreguntar("Elige la fecha en que se debe entregar el pedido. Déjalo vacío si quieres quitarla.", {
            titulo: "📅 Fecha de entrega",
            estilo: "info",
            tipoCampo: "date",
            valorInicial: String(actual).slice(0, 10),
            textoOk: "Guardar fecha"
          });
          if (valor === null) return; // canceló

          const limpio = String(valor).trim();
          if (limpio && !/^\d{4}-\d{2}-\d{2}$/.test(limpio)) {
            mostrarError("\u274C Usa el formato AAAA-MM-DD, por ejemplo 2026-09-30");
            return;
          }

          const r = await fetch("/api/pedidos/" + id + "/fecha-entrega", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fechaEntrega: limpio || null })
          });
          const d = await r.json();
          if (!r.ok || d.ok !== true) throw new Error(d.error || "No se pudo guardar");
          mostrarExito("\u2705 " + d.mensaje);
          await cargarPedidos();
        } catch (eFecha) {
          mostrarError("\u274C " + (eFecha.message || "No se pudo guardar la fecha"));
        }
      };

      try {
        const btnDescPedidos = document.getElementById("btn-descargar-pedidos");
        if (btnDescPedidos) {
          btnDescPedidos.addEventListener("click", () => {
            try {
              window.location.href = "/api/exportar/pedidos?estado=" + encodeURIComponent(filtroActual || "todos");
            } catch (eDesc) {
              console.error("Error descargando pedidos:", eDesc);
            }
          });
        }
      } catch (eBtnDesc) {
        console.warn("No se pudo activar la descarga de pedidos:", eBtnDesc);
      }

      // ========== ACCIONES ==========
      window.marcarTerminado = async function(id) {
        // MEJORA AGREGADA (punto 18): ventana con el estilo de la app
        const _pT = (pedidosCache || []).find(x => Number(x.id) === Number(id)) || {};
        if (!await uiConfirmar("El pedido pasa a la lista de terminados. Puedes reactivarlo después si hace falta.", {
          titulo: "¿Marcar como terminado?",
          estilo: "exito",
          detalle: _pT.folio ? "Folio " + _pT.folio + " · " + (_pT.escuela || "") : "",
          textoOk: "Sí, terminarlo"
        })) return;
        try { const r = await fetch(`/api/pedidos/${id}/estado`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({estado:"terminado"})}); if(!r.ok) throw new Error(); mostrarExito("✅ Terminado"); await cargarPedidos(); } catch(e){mostrarError("❌ Error");}
      };
      window.marcarActivo = async function(id) {
        // MEJORA AGREGADA (punto 18): ventana con el estilo de la app
        const _pR = (pedidosCache || []).find(x => Number(x.id) === Number(id)) || {};
        if (!await uiConfirmar("El pedido vuelve a la lista de pedidos en proceso.", {
          titulo: "¿Reactivar el pedido?",
          estilo: "info",
          detalle: _pR.folio ? "Folio " + _pR.folio + " · " + (_pR.escuela || "") : "",
          textoOk: "Sí, reactivar"
        })) return;
        try { const r = await fetch(`/api/pedidos/${id}/estado`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({estado:"activo"})}); if(!r.ok) throw new Error(); mostrarExito("✅ Reactivado"); await cargarPedidos(); } catch(e){mostrarError("❌ Error");}
      };
      window.eliminarPedido = async function(id) {
        // ===============================================================
        // MEJORA AGREGADA (puntos 18 y 23): antes de borrar te muestra
        // exactamente qué producción y qué operarias se van a ver afectadas.
        // ===============================================================
        const _p = (pedidosCache || []).find(x => Number(x.id) === Number(id)) || {};
        let _piezas = 0, _pagado = 0, _nombresOp = [], _pudoConsultar = false;
        try {
          const _rAv = await fetch(`/api/pedidos/${id}/avance`);
          if (_rAv.ok) {
            const _av = await _rAv.json();
            _pudoConsultar = true;
            _pagado = Number(_av.costoAvanceTotal) || 0;
            (_av.avance || []).forEach(it => {
              (it.operaciones || []).forEach(op => {
                _piezas += Number(op.piezasHechas) || 0;
                (op.desglose || []).forEach(d => {
                  if (d.operaria && _nombresOp.indexOf(d.operaria) === -1) _nombresOp.push(d.operaria);
                });
              });
            });
          }
        } catch (eAv) { _pudoConsultar = false; }
        const _ops = _nombresOp.length;
        const _tieneProduccion = _piezas > 0 || _ops > 0;

        let _detalle = (_p.folio ? "Folio " + _p.folio + " · " + (_p.escuela || "") + "\n" : "");
        if (_tieneProduccion) {
          _detalle += "\u26A0\uFE0F Este pedido YA tiene trabajo registrado:\n" +
                      "\u2022 " + _piezas + " pieza(s) cosidas\n" +
                      "\u2022 " + _ops + " operaria(s): " + _nombresOp.join(", ");
          if (!esEnc && _pagado > 0) {
            _detalle += "\n\u2022 $" + _pagado.toFixed(2) + " de mano de obra registrada";
          }
          _detalle += "\n\nSi lo borras, esos registros dejan de estar ligados a un pedido" +
                      " y el reporte de avance de este pedido ya no se podrá consultar.";
        } else if (_pudoConsultar) {
          _detalle += "Este pedido todavía no tiene ninguna pieza registrada," +
                      " así que borrarlo no afecta la nómina de nadie.";
        } else {
          _detalle += "No se pudo revisar el avance en este momento. Si el pedido ya tenía" +
                      " trabajo registrado, se perderá el reporte de avance.";
        }

        if (!await uiConfirmar(
          (_tieneProduccion || !_pudoConsultar)
            ? "Revisa bien lo de abajo antes de continuar. Esto no se puede deshacer."
            : "Esta acción no se puede deshacer.",
          {
            titulo: "¿Eliminar el pedido?",
            estilo: "peligro",
            detalle: _detalle,
            textoOk: (_tieneProduccion || !_pudoConsultar) ? "Entiendo, eliminar" : "Sí, eliminar",
            textoCancelar: "No, conservarlo"
          }
        )) return;
        try { const r = await fetch(`/api/pedidos/${id}`,{method:"DELETE"}); const d = await r.json(); if(!r.ok) throw new Error(d.error); mostrarExito("✅ Eliminado"); await cargarPedidos(); } catch(e){mostrarError("❌ "+e.message);}
      };

      // ========== MODAL EDITAR ==========
      window.abrirModalEditar = async function(id) {
        try {
          const r = await fetch(`/api/pedidos/${id}`);
          if (!r.ok) throw new Error();
          pedidoEditando = await r.json();
          document.getElementById("edit-escuela").value = pedidoEditando.escuela;
          document.getElementById("edit-folio").value = pedidoEditando.folio;
          document.getElementById("items-edit-pedido").innerHTML = "";
          if (pedidoEditando.items && pedidoEditando.items.length > 0) {
            const total = pedidoEditando.items.length;
            pedidoEditando.items.forEach((it, idx) => {
              // Solo expandir la última prenda, las demás colapsadas
              const expanded = (total === 1) || (idx === total - 1);
              crearItemHTML("items-edit-pedido", it, expanded);
            });
          } else if (pedidoEditando.prendas) {
            const pids = Array.isArray(pedidoEditando.prendas) ? pedidoEditando.prendas : [];
            pids.forEach(pid => crearItemHTML("items-edit-pedido", {prendaId:Number(pid), cantidad:0, operaciones:[]}, true));
          }
          modalEditar.classList.add("active");
        } catch(e) { mostrarError("❌ Error cargando pedido"); }
      };

      function cerrarModal() { modalEditar.classList.remove("active"); pedidoEditando = null; }
      document.getElementById("modal-close").addEventListener("click", cerrarModal);
      document.getElementById("btn-cancelar-editar").addEventListener("click", cerrarModal);
      modalEditar.addEventListener("click", e => { if(e.target===modalEditar) cerrarModal(); });

      document.getElementById("btn-guardar-editar").addEventListener("click", async () => {
        if (!pedidoEditando) return;
        const escuela = document.getElementById("edit-escuela").value.trim();
        const folio = document.getElementById("edit-folio").value.trim();
        // MEJORA AGREGADA (punto 19): se marca el campo exacto que falta
        limpiarMarcas(document.getElementById("modal-editar") || document);
        const encE = validarEncabezado("edit-escuela", "edit-folio");
        if (!encE.ok) { mostrarError(encE.error); marcarCampo(encE.campo, encE.aviso); return; }

        const validacion = validarPrendas("items-edit-pedido");
        if (!validacion.ok) { mostrarError(validacion.error); marcarCampo(validacion.campo, validacion.aviso); return; }
        
        const items = extraerItems("items-edit-pedido");

        const btn = document.getElementById("btn-guardar-editar");
        btn.disabled = true; btn.textContent = "⏳ Guardando...";
        try {
          const r = await fetch(`/api/pedidos/${pedidoEditando.id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({escuela, folio, items})});
          const d = await r.json();
          if (!r.ok) throw new Error(d.error);
          mostrarExito("✅ Actualizado");
          cerrarModal();
          await cargarPedidos();
        } catch(e) { mostrarError("❌ "+e.message); }
        finally { btn.disabled = false; btn.textContent = "💾 Guardar Cambios"; }
      });

      // ===================================================================
      // MEJORA AGREGADA (punto 21): las operaciones que se dejaron en $0 no
      // aparecen en el reporte del pedido (asi no hay que cargar operaciones
      // que la prenda no lleva). Aqui solo se avisa cuantas se omitieron, y
      // si alguna ya tiene piezas registradas se marca en amarillo.
      // ===================================================================
      function _notaSinPrecio(item) {
        try {
          const lista = (item && item.operacionesSinPrecio) || [];
          if (lista.length === 0) return "";
          const conPiezas = lista.filter(o => Number(o.piezasHechas) > 0);
          let txt = `<div style="margin-top:8px;font-size: 12.5px;color:var(--text-muted);">
            \u{1F515} ${lista.length} operación(es) sin precio no se muestran aquí:
            ${lista.map(o => o.costura).join(", ")}</div>`;
          if (conPiezas.length > 0) {
            txt += `<div style="margin-top:6px;font-size: 12.5px;color:#fbbf24;">
              \u26A0\uFE0F Ojo: ${conPiezas.map(o => o.costura + " (" + o.piezasHechas + " pzas)").join(", ")}
              ya tiene piezas registradas pero sigue en $0. Ponle precio para que cuente en el reporte.</div>`;
          }
          return txt;
        } catch (e) { return ""; }
      }

      // ==================================================================
      // MEJORA AGREGADA (faltantes por talla)
      // Debajo de cada operacion que no llega al 100% se pone una linea corta
      // que dice que talla y cuantas piezas faltan. Las operaciones completas
      // no muestran nada. Si el servidor no manda el detalle (version vieja),
      // devuelve texto vacio y la tabla se ve igual que siempre.
      // ==================================================================
      function _lineaFaltaTallas(op) {
        try {
          if (!op) return "";
          const faltan = op.tallasFaltantes || [];
          const fuera = op.piezasFueraDeTalla || [];
          const enc = Number(op.piezasEncargada || 0);
          if (faltan.length === 0 && fuera.length === 0 && enc === 0) return "";

          let html = "";

          if (faltan.length > 0) {
            const chips = faltan.map(t =>
              '<span style="display:inline-block;background:rgba(251,191,36,0.14);' +
              'color:#fbbf24;border-radius:6px;padding:1px 6px;margin:1px 4px 1px 0;' +
              'font-weight:700;white-space:nowrap;">' +
              _esc(t.talla) + " " + Number(t.faltan) + "</span>"
            ).join("");
            html += '<div style="font-size:12.5px;color:var(--text-muted);margin:2px 0 0 0;">' +
                    "Falta: " + chips + "</div>";
          }

          if (fuera.length > 0) {
            const txt = fuera.map(f => _esc(f.talla) + " (" + Number(f.piezas) + " pzas)").join(", ");
            html += '<div style="font-size:12.5px;color:#fbbf24;margin-top:3px;">' +
                    "\u26A0\uFE0F Hay piezas registradas en tallas que ya no están en el pedido: " +
                    txt + ". Revisa el pedido para no perder ese trabajo.</div>";
          }

          if (enc > 0) {
            html += '<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;">' +
                    "\u{1F4CB} La encargada registró " + enc + " pzas aparte (no cuentan en este avance).</div>";
          }

          return html;
        } catch (e) { return ""; }
      }

      function _esc(x) {
        return String(x == null ? "" : x)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // ========== MODAL AVANCE ==========
      window.verAvance = async function(id) {
        try {
          // MEJORA AGREGADA (punto 22): el modal se abre ya con el aviso de cargando
          uiCargando("avance-contenido", "Calculando el avance del pedido\u2026");
          modalAvance.classList.add("active");
          const r = await fetch(`/api/pedidos/${id}/avance`);
          if (!r.ok) throw new Error();
          const data = await r.json();
          // MEJORA AGREGADA: la encargada no debe ver montos/estimados de dinero en el avance
          let h = `<div style="margin-bottom:12px;"><strong>${data.escuela}</strong> · Folio: ${data.folio}<br>
            ${!esEnc ? `<span style="font-size: 13px;color:var(--text-muted);">Estimado: $${(data.costoEstimadoTotal||0).toFixed(2)} · Avance: $${(data.costoAvanceTotal||0).toFixed(2)}</span>` : ''}</div>`;
          (data.avance||[]).forEach(item => {
            h += `<div class="item-card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <strong style="font-size:14px;">${item.prendaEtiqueta || item.prenda}</strong>
                <span style="font-size: 13px;color:${item.porcentajeGeneral>=100?'var(--success)':'var(--accent)'};font-weight:700;">${item.porcentajeGeneral}%</span>
              </div>
              <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(item.porcentajeGeneral,100)}%"></div></div>
              <div style="font-size: 12.5px;color:var(--text-muted);margin:6px 0;">${item.cantidad} pzas · ${item.operacionesCompletas}/${item.totalOperaciones} ops completas</div>
              <table class="ops-table"><thead><tr><th>Operación</th><th>Máquina</th><th>Avance</th><th>%</th></tr></thead><tbody>
              ${item.operaciones.map(op => {
                // MEJORA AGREGADA: renglon extra con las tallas que faltan
                const extra = _lineaFaltaTallas(op);
                return `<tr>
                <td>${op.costura}</td>
                <td style="font-size: 12.5px;color:var(--text-muted);">${op.maquina}</td>
                <td>${op.piezasHechas}/${op.cantidadTotal}</td>
                <td style="color:${op.porcentaje>=100?'var(--success)':op.porcentaje>0?'var(--accent)':'var(--text-muted)'};font-weight:700;">${op.porcentaje}%</td>
              </tr>` + (extra ? `<tr class="fila-falta-tallas"><td colspan="4" style="padding-top:0;border-top:0;">${extra}</td></tr>` : "");
              }).join("")}
              </tbody></table>
              ${_notaSinPrecio(item)}
            </div>`;
          });
          document.getElementById("avance-contenido").innerHTML = h;
          modalAvance.classList.add("active");
        } catch(e) { mostrarError("❌ Error cargando avance"); }
      };
      document.getElementById("modal-avance-close").addEventListener("click", () => modalAvance.classList.remove("active"));
      modalAvance.addEventListener("click", e => { if(e.target===modalAvance) modalAvance.classList.remove("active"); });

      // ========== HELPERS ==========
      function mostrarError(m) { msgErr.textContent=m; msgErr.style.display="block"; msgOk.style.display="none"; setTimeout(()=>{msgErr.style.display="none";},5000); }
      function mostrarExito(m) { msgOk.textContent=m; msgOk.style.display="block"; msgErr.style.display="none"; setTimeout(()=>{msgOk.style.display="none";},3000); }
      document.getElementById("btn-volver").addEventListener("click", () => { window.location.href = "/dashboard"; });

      await cargarPedidos();
    });
  </script>
    <!-- MEJORA AGREGADA (punto 27): botones con nombre accesible y area de toque comoda.
         Componente aislado y autocontenido. Solo AGREGA atributos de accesibilidad y un
         tamano minimo a los botones que resultan demasiado chicos para el dedo.
         No cambia el texto visible, ni los estilos de color, ni ninguna funcion existente.
         Si algo falla, se cancela solo y la pantalla sigue funcionando igual. -->
    <style>
      /* solo se aplica a los botones que el propio componente detecta como chicos */
      .a11y-toque {
        min-width: 40px !important;
        min-height: 40px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      /* foco visible al navegar con teclado (antes no se veia en varios botones) */
      .a11y-foco:focus-visible {
        outline: 2px solid #93c5fd !important;
        outline-offset: 2px !important;
      }
    </style>
    <script>
      (function () {
        "use strict";
        try {
          // ---- nombres para los botones que son solo un icono ----
          var NOMBRES = {
            "\u2190": "Volver", "\u2b05": "Volver", "\u2190\ufe0f": "Volver",
            "\u2715": "Cerrar", "\u2716": "Cerrar", "\u00d7": "Cerrar", "\u274c": "Cerrar",
            "\u2717": "Cerrar", "\u2718": "Cerrar",
            "\u270f\ufe0f": "Editar", "\u270f": "Editar", "\u1f4dd": "Editar",
            "\ud83d\udcdd": "Editar",
            "\ud83d\uddd1\ufe0f": "Eliminar", "\ud83d\uddd1": "Eliminar",
            "\ud83d\udd11": "Restablecer contrase\u00f1a",
            "\ud83d\udcc5": "Fecha de entrega",
            "\ud83d\udce5": "Descargar",
            "\ud83d\udd0d": "Buscar",
            "\u2795": "Agregar", "\u2b06": "Subir", "\u2b07": "Bajar",
            "\ud83d\udccb": "Copiar",
            "\ud83d\udd04": "Actualizar",
            "\ud83d\udda8\ufe0f": "Imprimir", "\ud83d\udda8": "Imprimir",
            "\ud83d\udc41\ufe0f": "Ver detalle", "\ud83d\udc41": "Ver detalle",
            "\u2705": "Confirmar", "\u2714\ufe0f": "Confirmar", "\u2714": "Confirmar",
            "\u2699\ufe0f": "Configuraci\u00f3n", "\u2699": "Configuraci\u00f3n",
            "\u2b50": "Destacar",
            "\u25b6": "Continuar", "\u25c0": "Anterior",
            "\u22ee": "M\u00e1s opciones", "\u2026": "M\u00e1s opciones"
          };

          // quita emojis y simbolos para saber si queda texto de verdad
          function soloTexto(t) {
            try {
              return String(t || "")
                .replace(/[\u2190-\u21ff\u2300-\u27bf\u2b00-\u2bff\ufe0f\u200d]/g, "")
                .replace(/[\ud800-\udbff][\udc00-\udfff]/g, "")
                .replace(/\s+/g, " ")
                .trim();
            } catch (e) { return String(t || "").trim(); }
          }

          // hay texto de verdad solo si aparece alguna letra o numero
          function tieneLetras(t) {
            try { return /[a-zA-Z0-9\u00c0-\u00d6\u00d8-\u00f6\u00f8-\u024f]/.test(String(t || "")); }
            catch (e) { return false; }
          }

          function nombrePara(btn) {
            var visible = (btn.textContent || "").replace(/\s+/g, " ").trim();
            if (!visible) {
              // boton sin texto: intentar por su clase
              var cl = btn.className || "";
              if (/cerrar|close/i.test(cl)) return "Cerrar";
              if (/back|volver/i.test(cl)) return "Volver";
              return "";
            }
            var limpio = soloTexto(visible);
            if (limpio && tieneLetras(limpio)) return limpio;   // tiene palabras: usamos las palabras
            if (NOMBRES[visible]) return NOMBRES[visible];
            // probar quitando el selector de variacion
            var sinVar = visible.replace(/\ufe0f/g, "");
            if (NOMBRES[sinVar]) return NOMBRES[sinVar];
            return "";
          }

          function esChico(btn) {
            try {
              var r = btn.getBoundingClientRect();
              if (!r || (r.width === 0 && r.height === 0)) return false; // oculto: no medimos
              return r.height < 40 || r.width < 40;
            } catch (e) { return false; }
          }

          function arreglar(raiz) {
            var lista;
            try {
              lista = (raiz || document).querySelectorAll(
                'button:not([data-a11y]), [role="button"]:not([data-a11y]), ' +
                '.modal-close:not([data-a11y])'
              );
            } catch (e) { return; }
            for (var i = 0; i < lista.length; i++) {
              var b = lista[i];
              try {
                b.setAttribute("data-a11y", "1");
                b.classList.add("a11y-foco");

                // si es una "X" de cerrar hecha con div, se le da rol de boton y
                // se puede usar con el teclado. El clic de siempre sigue igual.
                if (b.tagName !== "BUTTON" && !b.getAttribute("role")) {
                  b.setAttribute("role", "button");
                  if (b.getAttribute("tabindex") === null) b.setAttribute("tabindex", "0");
                  b.addEventListener("keydown", function (ev) {
                    try {
                      if (ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar") {
                        ev.preventDefault();
                        b.click();
                      }
                    } catch (e) {}
                  });
                }

                var nom = nombrePara(b);
                if (nom) {
                  if (!b.getAttribute("aria-label")) b.setAttribute("aria-label", nom);
                  if (!b.getAttribute("title")) b.setAttribute("title", nom);
                }
                // los iconos decorativos no deben leerse dos veces
                var visible = (b.textContent || "").replace(/\s+/g, " ").trim();
                if (visible && !tieneLetras(visible) && b.getAttribute("aria-label")) {
                  // es solo icono: lo marcamos para el lector de pantalla
                  var hijos = b.children;
                  if (hijos.length === 0) b.setAttribute("data-icono", "1");
                }
                if (esChico(b)) b.classList.add("a11y-toque");
              } catch (e) { /* un boton problematico no detiene el resto */ }
            }
          }

          function arrancar() {
            arreglar(document);
            try {
              if (typeof MutationObserver === "function") {
                var obs = new MutationObserver(function (muts) {
                  try {
                    for (var i = 0; i < muts.length; i++) {
                      var añadidos = muts[i].addedNodes || [];
                      for (var j = 0; j < añadidos.length; j++) {
                        var n = añadidos[j];
                        if (n && n.nodeType === 1) arreglar(n.parentNode || document);
                      }
                    }
                  } catch (e) {}
                });
                obs.observe(document.body, { childList: true, subtree: true });
              } else {
                // navegador viejo: repaso periodico acotado
                var veces = 0;
                var t = setInterval(function () {
                  try { arreglar(document); } catch (e) {}
                  if (++veces > 40) clearInterval(t);
                }, 1500);
              }
            } catch (e) {}
          }

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function () {
              try { arrancar(); } catch (e) {}
            });
          } else {
            arrancar();
          }
        } catch (e) {
          /* si el componente falla, la pantalla queda exactamente como antes */
        }
      })();
    
      // ====================================================================
      // MEJORA AGREGADA (teclado): moverse con las flechas y con Enter al
      // capturar o editar un pedido, sin tener que tocar la pantalla.
      //   Enter        -> pasa al siguiente campo; si estas en la ultima
      //                   cantidad de tallas, agrega otra talla y se pone ahi
      //   Flecha abajo -> mismo campo, renglon de abajo
      //   Flecha arriba-> mismo campo, renglon de arriba
      //   Flecha derecha / izquierda -> campo de al lado (solo cuando el
      //                   cursor ya esta al final o al inicio del texto,
      //                   para no estorbar mientras escribes)
      // Todo va dentro de try/catch: si algo falla, la captura sigue igual
      // que antes con el teclado normal.
      // ====================================================================
      (function activarNavegacionTeclado() {
        try {
          var CONTENEDORES = ["items-nuevo-pedido", "items-edit-pedido"];
          var NAVEGABLES = ".inp-modelo, .talla-input, .talla-cantidad, .op-precio";

          function contenedorDe(el) {
            for (var i = 0; i < CONTENEDORES.length; i++) {
              var c = document.getElementById(CONTENEDORES[i]);
              if (c && c.contains(el)) return c;
            }
            return null;
          }

          function listaDe(cont) {
            return Array.prototype.slice.call(cont.querySelectorAll(NAVEGABLES))
              .filter(function (el) { return !el.disabled && !el.readOnly && el.offsetParent !== null; });
          }

          function enfocar(el) {
            if (!el) return false;
            try {
              el.focus();
              try { el.select(); } catch (eSel) {}
            } catch (eFoco) { return false; }
            return true;
          }

          function claseNav(el) {
            var clases = ["talla-input", "talla-cantidad", "op-precio", "inp-modelo"];
            for (var i = 0; i < clases.length; i++) {
              if (el.classList.contains(clases[i])) return clases[i];
            }
            return null;
          }

          /** Mismo campo, un renglon arriba o abajo dentro de la misma tabla. */
          function vecinoVertical(el, direccion) {
            var fila = el.closest("tr");
            if (!fila) return null;
            var clase = claseNav(el);
            if (!clase) return null;
            var siguiente = direccion > 0 ? fila.nextElementSibling : fila.previousElementSibling;
            while (siguiente) {
              var destino = siguiente.querySelector("." + clase);
              if (destino && !destino.disabled && !destino.readOnly) return destino;
              siguiente = direccion > 0 ? siguiente.nextElementSibling : siguiente.previousElementSibling;
            }
            return null;
          }

          function mover(cont, el, paso) {
            var lista = listaDe(cont);
            var i = lista.indexOf(el);
            if (i === -1) return false;
            return enfocar(lista[i + paso]);
          }

          /** ¿El cursor ya esta al inicio / al final del texto? */
          function enExtremo(el, cual) {
            try {
              if (el.type === "number") return true; // los number no dan posicion de cursor
              var pos = el.selectionStart;
              if (pos === null || pos === undefined) return true;
              if (el.selectionStart !== el.selectionEnd) return false;
              return cual === "inicio" ? (pos === 0) : (pos === (el.value || "").length);
            } catch (e) {
              return true;
            }
          }

          function botonAgregarTalla(card) {
            var btn = null;
            var candidatos = card.querySelectorAll("button.btn-add-op");
            for (var b = 0; b < candidatos.length; b++) {
              if (!candidatos[b].classList.contains("btn-agregar-operacion-nueva")) { btn = candidatos[b]; break; }
            }
            return btn;
          }

          /** Enter en el modelo cuando la prenda aun no tiene tallas: crea la primera. */
          function primeraTallaSiFalta(el) {
            try {
              var card = el.closest(".item-card");
              if (!card) return false;
              var tbody = card.querySelector(".tallas-container tbody");
              if (!tbody || tbody.children.length > 0) return false;
              var btn = botonAgregarTalla(card);
              if (typeof window._addTalla !== "function" || !btn) return false;
              window._addTalla(btn);
              var nueva = tbody.lastElementChild;
              var destino = nueva ? nueva.querySelector(".talla-input") : null;
              if (destino) { enfocar(destino); return true; }
            } catch (e) {}
            return false;
          }

          /** Enter en la ultima cantidad de tallas: agrega otro renglon de talla. */
          function agregarTallaSiAplica(el) {
            try {
              if (!el.classList.contains("talla-cantidad")) return false;
              var fila = el.closest("tr");
              if (!fila || fila.nextElementSibling) return false;
              // Solo se agrega otro renglon si el actual ya quedo lleno, para no
              // dejar renglones vacios al presionar Enter de mas.
              var inpTalla = fila.querySelector(".talla-input");
              var tallaEscrita = inpTalla && String(inpTalla.value || "").trim() !== "";
              var cantidadPuesta = (Number(el.value) || 0) > 0;
              if (!tallaEscrita || !cantidadPuesta) return false;
              var card = el.closest(".item-card");
              if (!card) return false;
              var btn = botonAgregarTalla(card);
              if (typeof window._addTalla === "function" && btn) {
                window._addTalla(btn);
                var tbody = card.querySelector(".tallas-container tbody");
                var nueva = tbody ? tbody.lastElementChild : null;
                var destino = nueva ? nueva.querySelector(".talla-input") : null;
                if (destino) { enfocar(destino); return true; }
              }
            } catch (e) {}
            return false;
          }

          document.addEventListener("keydown", function (e) {
            try {
              var el = e.target;
              if (!el || !el.matches || !el.matches(NAVEGABLES)) return;
              if (e.ctrlKey || e.altKey || e.metaKey) return;
              var cont = contenedorDe(el);
              if (!cont) return;

              if (e.key === "Enter") {
                e.preventDefault();
                if (agregarTallaSiAplica(el)) return;
                if (primeraTallaSiFalta(el)) return;
                mover(cont, el, 1);
                return;
              }
              if (e.key === "ArrowDown") {
                e.preventDefault();
                if (!enfocar(vecinoVertical(el, 1))) mover(cont, el, 1);
                return;
              }
              if (e.key === "ArrowUp") {
                e.preventDefault();
                if (!enfocar(vecinoVertical(el, -1))) mover(cont, el, -1);
                return;
              }
              if (e.key === "ArrowRight") {
                if (!enExtremo(el, "final")) return; // sigue moviendo el cursor normal
                e.preventDefault();
                mover(cont, el, 1);
                return;
              }
              if (e.key === "ArrowLeft") {
                if (!enExtremo(el, "inicio")) return;
                e.preventDefault();
                mover(cont, el, -1);
                return;
              }
            } catch (eNav) { /* nunca bloquear la captura */ }
          }, true);
        } catch (eInit) {
          console.warn("Navegacion con teclado no disponible:", eInit);
        }
      })();

    </script>
